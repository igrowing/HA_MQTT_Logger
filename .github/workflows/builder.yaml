name: Builder (amd64/aarch64)

on:
  push:
    # TODO: drop "addon" once the addon branch is merged into main - it's
    # here only to let the pipeline (including the release job) be tested
    # from that branch before merging.
    branches: [main, addon]
    paths:
      - "mqtt_logger/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    branches: [main]
    paths:
      - "mqtt_logger/**"
      - ".github/workflows/builder.yaml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read app version
        id: version
        run: |
          version="$(sed -n 's/^version: *"\(.*\)"/\1/p' mqtt_logger/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Supported, tested path - matches the current official amd64/aarch64
      # app-builder guidance. This is the only arch pair this repo commits
      # to keeping working; see builder-32bit.yaml for the best-effort
      # armv7/armhf attempt.
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: mqtt_logger
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/amd64-mqtt-logger:${{ steps.version.outputs.version }},ghcr.io/${{ github.repository_owner }}/amd64-mqtt-logger:latest

      - name: Build and push (aarch64)
        uses: docker/build-push-action@v6
        with:
          context: mqtt_logger
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/aarch64-mqtt-logger:${{ steps.version.outputs.version }},ghcr.io/${{ github.repository_owner }}/aarch64-mqtt-logger:latest

  release:
    name: Tag and create GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        run: |
          version="$(sed -n 's/^version: *"\(.*\)"/\1/p' mqtt_logger/config.yaml)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # config.yaml's version is the single source of truth for releases -
      # bump it (and add a matching CHANGELOG.md section) to cut a new one.
      # A push that doesn't change the version is a no-op here, since the
      # tag from the last release still exists.
      - name: Check whether this version was already released
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract this version's CHANGELOG.md section
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          awk -v ver="## ${{ steps.version.outputs.version }}" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' mqtt_logger/CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release v${{ steps.version.outputs.version }}" > /tmp/release_notes.md
          fi

      - name: Create tag and GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          target_commitish: ${{ github.sha }}
