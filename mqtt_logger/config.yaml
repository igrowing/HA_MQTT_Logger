name: MQTT Logger
version: "1.0.0"
slug: mqtt_logger
description: Logs every MQTT message to Loki and browses it in a built-in Grafana dashboard
url: "https://github.com/igrowing/HA_MQTT_Logger"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
init: false
startup: services
boot: auto
watchdog: "http://[HOST]:[PORT:3000]/api/health"
ingress: true
ingress_port: 3000
ingress_entry: "/"
panel_icon: mdi:message-text-clock
panel_title: MQTT Logger
image: "ghcr.io/igrowing/{arch}-mqtt-logger"
ports:
  1880/tcp: 1880
ports_description:
  1880/tcp: "Node-RED editor (optional - only for inspecting/debugging the flow; the dashboard itself is reachable from the sidebar via Ingress)"
options:
  mqtt_username: ""
  mqtt_password: ""
  retention_days: 30
  filter_regex: []
schema:
  mqtt_username: "str"
  mqtt_password: "password"
  retention_days: "int(1,365)"
  filter_regex:
    - "str"
